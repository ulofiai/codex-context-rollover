name: Report a bug
description: Report incorrect snapshot, handoff, cleanup, or isolation behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload real transcripts, credentials, tokens, private paths, or unredacted plugin data. Use a minimal synthetic reproduction.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "v1.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Include the hook event sequence and relevant environment-variable overrides, but no private data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real transcripts, credentials, tokens, private paths, and proprietary content.
          required: true
