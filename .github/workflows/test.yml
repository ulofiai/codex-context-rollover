name: Cross-platform verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-plugin:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Syntax-check the installed hook
        run: node --check plugins/codex-context-rollover/scripts/context-rollover.mjs
      - name: Run behavior tests
        run: node --test test/post-compact.test.mjs
